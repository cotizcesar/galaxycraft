[package]
name = "galaxycraft"
version = "0.1.13"
edition = "2024"
rust-version = "1.98.0"
description = "A Rust reconstruction of StarCraft 1.23 core gameplay logic, driven by data recovered from the shipped executable."
license = "MIT"
repository = "https://github.com/cotizcesar/galaxycraft"
keywords = ["starcraft", "reverse-engineering", "rts", "game-engine", "deterministic"]
categories = ["games", "game-engines"]
# Reads retail data at runtime; never published to crates.io.
publish = false

[lib]
name = "galaxycraft"
path = "src/lib.rs"

# All binaries in src/bin/ are picked up by cargo's autobins; no [[bin]] needed.
# Build profiles live in the repository-root workspace (`../Cargo.toml`).

[dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
font8x8 = "0.3.1"
fontdue = { version = "0.9.5", default-features = false }
# Glyph outlines for the CEF text rasteriser (already in the tree via fontdue).
ttf-parser = { version = "0.25.1", default-features = false, features = ["opentype-layout", "no-std-float"] }
lewton = "0.10.2"
libloading = "0.9"
# Gamepad input (Xbox / PlayStation / Switch Pro / Steam Deck).  Linux uses
# evdev through udev, Windows XInput, macOS IOKit.
gilrs = "0.11.2"
minifb = { version = "0.29", default-features = false, features = ["x11", "wayland", "dlopen"] }
ogg = "0.9.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

# LAN discovery: shared UDP port and interface broadcasts (Unix sockets).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
cc = "1.11.0"
